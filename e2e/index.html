<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$ pnpm dev</title>
  <style>
    #whiteboard {
      width: 600px;
      height: 400px;
      border: 1px solid;
    }
    html:has(#resize:checked) #whiteboard {
      resize: both;
      overflow: scroll;
    }
  </style>
</head>
<body>
  <p>
    <label>
      <input id="resize" type="checkbox">
      Resize Mode
    </label>
  </p>
  <div id="whiteboard"></div>
  <p>
    <button id="btn-add">Add Example Presentation</button>
    <button id="btn-add2">Add OriginSize PDF</button>
    <button id="btn-pdf">Make PDF</button>
    <button id="save">Save</button>
    <button id="btn-scale-1">Scale 1x</button>
    <button id="btn-scale-2">Scale 2x</button>
    <button id="btn-scale-4">Scale 4x</button>
    <button id="btn-read-scale">Read Scale</button>
    <output id="camera-status">No focused Presentation</output>
  </p>
  <script type="module" src="/e2e/main.ts"></script>
</body>
</html>
